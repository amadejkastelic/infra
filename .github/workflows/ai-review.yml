name: AI Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.fork == false
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ai-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Review diff
        env:
          Z_AI_TOKEN: ${{ secrets.Z_AI_API_TOKEN }}
          Z_AI_MODEL: glm-5.3-flash
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -z "${Z_AI_TOKEN}" ]; then
            echo "Z_AI_API_TOKEN secret is missing"
            exit 1
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          git diff "${BASE_SHA}...${HEAD_SHA}" -- . ':(exclude)flake.lock' > diff.txt

          if [ ! -s diff.txt ]; then
            echo "No reviewable changes (excluding flake.lock), skipping"
            exit 0
          fi

          truncation_note=""
          if [ "$(stat -c%s diff.txt)" -gt 200000 ]; then
            head -c 200000 diff.txt > diff-truncated.txt
            mv diff-truncated.txt diff.txt
            truncation_note=$'\n\nNote: the diff was truncated to its first 200,000 characters.'
          fi

          git diff -U0 "${BASE_SHA}...${HEAD_SHA}" -- . ':(exclude)flake.lock' \
            | awk '
              /^diff --git / { path = "" }
              /^\+\+\+ / { if ($2 != "/dev/null") path = substr($2, 3); next }
              /^--- / { next }
              /^@@ / {
                rl = 0; ll = 0
                for (i = 2; i <= NF; i++) {
                  if ($i ~ /^\+[0-9]/) rl = substr($i, 2) + 0
                  else if ($i ~ /^-[0-9]/) ll = substr($i, 2) + 0
                }
                next
              }
              path == "" { next }
              /^\+/ { print path, rl, "R"; rl++; next }
              /^-/ { print path, ll, "L"; ll++; next }
            ' > anchors.txt

          system_prompt=$(cat <<'EOF'
          You are an expert NixOS reviewer for a personal flake-based dotfiles repository
          using flake-parts, NixOS and nix-darwin systems, Home Manager, sops-nix, disko,
          and custom modules under modules/ and system/.

          Review only the provided diff, looking for:
          1. Correctness: wrong or missing module options, type mismatches, missing imports,
             eval-breaking mistakes, broken derivations, typos in attribute paths.
          2. Nix hygiene: patterns inconsistent with surrounding code, logic duplicated from
             lib/, versioned packages missing passthru.updateScript.
          3. Security: reading or writing sops-encrypted secrets.yaml files (forbidden),
             hardcoded credentials, unnecessarily broad permissions or open firewall ports.
          4. Conventions: the repo formats with nixfmt-rfc-style and keeps code
             self-documenting without comments.

          Respond with only a JSON object, no prose and no code fences, of this shape:
          {"summary": string, "findings": array}
          where each finding is an object with fields:
          file: a path exactly as it appears in the diff headers.
          line: the line number in the new file for added or changed lines, or in the
            old file for removed lines. Anchor to the changed line closest to the problem.
          severity: one of critical, warning, nitpick.
          message: one line describing the problem.
          suggestion: a short suggested fix, or an empty string.

          Order findings most severe first. Report only significant problems: strict about
          real bugs, conservative about style, and say so in the message when unsure. An
          empty findings array means the change looks good.
          EOF
          )

          jq -n \
            --arg model "${Z_AI_MODEL}" \
            --arg system "${system_prompt}" \
            --rawfile diff diff.txt \
            --arg note "${truncation_note}" \
            '{
              model: $model,
              max_tokens: 32000,
              system: $system,
              messages: [
                {
                  role: "user",
                  content: ("Review this pull request diff.\n\n" + $diff + $note)
                }
              ]
            }' > payload.json

          response=$(curl -sS --fail-with-body --max-time 600 \
            "https://api.z.ai/api/anthropic/v1/messages" \
            -H "x-api-key: ${Z_AI_TOKEN}" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            --data @payload.json)

          printf '%s' "${response}" \
            | jq -r '[.content[]? | select(.type == "text") | .text] | join("\n")' > reply.txt

          if [ ! -s reply.txt ]; then
            echo "Model returned no review text; raw response:"
            printf '%s' "${response}" | jq .
            exit 1
          fi

          if ! jq -e 'if (type == "object" and (.summary | type == "string") and (.findings | type == "array"))
              then . else error("invalid review JSON shape") end' \
            reply.txt > findings.json 2> /dev/null; then
            awk '/^```json|^```$/{f = !f; next} f' reply.txt \
              | jq -e 'if (type == "object" and (.summary | type == "string") and (.findings | type == "array"))
                then . else error("invalid review JSON shape") end' > findings.json \
              || {
                echo "Model did not return valid JSON; raw reply:"
                cat reply.txt
                exit 1
              }
          fi

          jq -n \
            --arg model "${Z_AI_MODEL}" \
            --rawfile findings findings.json \
            --rawfile anchors anchors.txt \
            '
            def rank: {"critical": 0, "warning": 1, "nitpick": 2}[.severity] // 1;
            def norm: map(
              .file = (.file // "")
              | .line = ((.line // 0) | (if type == "number" then . else (tonumber? // 0) end))
              | .severity = (.severity // "warning")
              | .message = (.message // "")
              | .suggestion = (.suggestion // "")
            );

            ($anchors | split("\n") | map(select(length > 0) | split(" "))
              | map({key: (.[0] + ":" + .[1]), value: .[2]}) | from_entries) as $a
            | (($findings | fromjson).findings | norm | sort_by(rank)) as $fs
            | ($fs | map(select($a[.file + ":" + (.line | tostring)] != null))) as $anchored
            | ($fs | map(select($a[.file + ":" + (.line | tostring)] == null))) as $loose
            | {
                body: (
                  "## AI Review (`" + $model + "`)\n\n### Summary\n\n"
                  + (($findings | fromjson).summary | rtrimstr("\n"))
                  + "\n\n### Findings\n\n"
                  + (if ($fs | length) == 0 then "No significant findings."
                     else ([
                        $anchored[]
                        | "- **" + .severity + "** `" + .file + ":" + (.line | tostring) + "` — " + .message
                      ] + [
                        $loose[]
                        | "- **" + .severity + "** `" + .file + (if .line > 0 then ":" + (.line | tostring) else "" end) + "` — " + .message
                          + (if .suggestion != "" then "\n\n  > Suggested fix: " + .suggestion else "" end)
                      ]) | join("\n")
                  end)
                ),
                event: "COMMENT",
                comments: [
                  $anchored[]
                  | {
                      path: .file,
                      line: .line,
                      side: (if $a[.file + ":" + (.line | tostring)] == "R" then "RIGHT" else "LEFT" end),
                      body: ("**" + .severity + "** — " + .message
                        + (if .suggestion != "" then "\n\nSuggested fix: " + .suggestion else "" end))
                    }
                ]
              }
            ' > review-payload.json

          if ! gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --input review-payload.json; then
            echo "Review with inline comments failed, retrying as a plain review comment"
            jq 'del(.comments)' review-payload.json > review-payload-plain.json
            gh api -X POST "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" --input review-payload-plain.json
          fi
